name: kalika-reviewer
version: 0.1.0
description: Multi-target package with kalika-reviewer agent and code-review skill
targets:
  - copilot-cli
  - claude-code
  - codex-cli
agents:
  - name: kalika-reviewer
    description: Kalika code reviewer agent
    source: agents/kalika-reviewer.md
    targets:
      copilot-cli:
        scope: user
      claude-code:
        scope: project
      codex-cli:
        scope: project
skills:
  - name: code-review
    description: Code review skill
    source: skills/code-review
    targets:
      copilot-cli:
        scope: user
      claude-code:
        scope: project
      codex-cli:
        scope: project
